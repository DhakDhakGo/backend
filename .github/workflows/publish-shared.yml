name: Publish Shared Package

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
      - check-api-gateway-token-validation
    paths:
      - 'services/shared/**'
  workflow_dispatch:

jobs:
  publish:
    name: Publish @dhakdhakgo/shared
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: check-api-gateway-token-validation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish package
        working-directory: services/shared
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set @dhakdhakgo:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${NODE_AUTH_TOKEN}
          npm publish --registry=https://npm.pkg.github.com --access=restricted
