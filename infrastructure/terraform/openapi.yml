  /api/users/register:
    post:
      operationId: "registerUser"
      x-google-backend:
        address: "https://user-service-134445090159.us-central1.run.app"
      responses:
        201:
          description: "User registered successfully"
        400:
          description: "Invalid request body"
        500:
          description: "Internal server error"

  /api/users/login:
    post:
      operationId: "loginUser"
      x-google-backend:
        address: "https://user-service-134445090159.us-central1.run.app"
      security:
        - api_key: []
      responses:
        200:
          description: "Login successful"
        401:
