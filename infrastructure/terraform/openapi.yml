swagger: "2.0"
info:
  title: "DhakDhakGo API Gateway"
  description: "Unified Gateway for AI, Users, Interactions, and Posts"
  version: "1.0.0"
schemes:
  - "https"
produces:
  - "application/json"

# GLOBAL SECURITY: Validates Firebase JWTs for all routes
securityDefinitions:
  firebase_auth:
    type: "oauth2"
    authorizationUrl: "https://accounts.google.com/o/oauth2/v2/auth"
    flow: "implicit"
    x-google-issuer: "https://securetoken.google.com/${project_id}"
    x-google-jwks_uri: "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
    x-google-audiences: "${project_id}"
  api_key:
    type: "apiKey"
    name: "X-API-Key"
    in: "header"

paths:
  # 1. AI Service
  /api/ai/bike-insights/{bikeName}:
    get:
      operationId: "getBikeInsights"
      x-google-backend:
        address: "https://ai-service-134445090159.us-central1.run.app"
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - name: "bikeName"
          in: "path"
          required: true
          type: "string"
      security:
        - firebase_auth: []
      responses:
        200:
          description: "Bike insights retrieved successfully"
        401:
          description: "Authentication error - invalid or expired token"
        404:
          description: "Bike not found"
        500:
          description: "AI service temporarily unavailable"
        503:
          description: "AI response format error"

  /api/ai/compare-bikes:
    post:
      operationId: "compareBikes"
      x-google-backend:
        address: "https://ai-service-134445090159.us-central1.run.app"
      security:
        - firebase_auth: []
      responses:
        200:
          description: "Bikes compared successfully"
        401:
          description: "Authentication error - invalid or expired token"
        500:
          description: "AI service temporarily unavailable"
        503:
          description: "AI response format error"

  /api/ai/compare-summary:
    post:
      operationId: "getComparisonSummary"
      x-google-backend:
        address: "https://ai-service-134445090159.us-central1.run.app"
      security:
        - firebase_auth: []
      responses:
        200:
          description: "Comparison summary generated successfully"
        401:
          description: "Authentication error - invalid or expired token"
        500:
          description: "AI service temporarily unavailable"
        503:
          description: "AI response format error"

  # 2. User Service
  /api/users/{userId}:
    get:
      operationId: "getUser"
      x-google-backend:
        address: "https://user-service-134445090159.us-central1.run.app"
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - name: "userId"
          in: "path"
          required: true
          type: "string"
      security:
        - firebase_auth: []
      responses:
        200:
          description: "User retrieved successfully"
        401:
          description: "Authentication error - invalid or expired token"
        404:
          description: "User not found"
        500:
          description: "Internal server error"

    put:
      operationId: "updateUser"
      x-google-backend:
        address: "https://user-service-134445090159.us-central1.run.app"
        path_translation: APPEND_PATH_TO_ADDRESS
